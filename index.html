<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Investigation Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top-bar">
        <h1>Investigation Board</h1>
    </header>

    <main class="board">
        <!-- LEFT COLUMN -->
        <section class="panel clues-panel">
            <h2 class="panel-header">Clues</h2>

            <div class="clue-list">
                <div class="clue-row"></div>
                <div class="clue-row"></div>
                <div class="clue-row"></div>
                <div class="clue-row"></div>
                <div class="clue-row"></div>
                <div class="clue-row"></div>
                <div class="clue-row"></div>
                <div class="clue-row"></div>
            </div>
        </section>

        <!-- RIGHT COLUMN -->
        <section class="panel suspects-panel">
            <div class="suspects-heading">
                <h2 class="panel-header">Suspects</h2>

                <div class="remaining-counter">
                    Remaining Suspects:
                    <span id="remainingCount">0</span>
                </div>
            </div>

            <div class="suspect-grid">
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>

                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>

                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>

                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
                <div class="suspect-cell"></div>
            </div>
        </section>
    </main>
</body>
</html>
