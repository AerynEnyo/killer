<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investigation Board</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="top-bar">
    <h1>Investigation Board</h1>
</header>

<main class="content">

    <section class="panel">
        <h2>Clues</h2>

        <div id="clueList">
            <!-- Clues will go here -->
        </div>

        <div class="remaining">
            <h3>Remaining Suspects</h3>
            <div id="remainingCount">0</div>
        </div>
    </section>

    <section class="panel">
        <h2>Suspects</h2>

        <div id="suspectList"></div>
    </section>

</main>

<script src="script.js?v=2"></script>

</body>
</html>
