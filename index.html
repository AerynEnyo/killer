<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hunt the Killer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-board">

        <!-- LEFT COLUMN -->
        <section class="clues-section">

            <div class="section-title">
                Clues
            </div>

            <!-- Clues get added here later -->
            <div
                id="cluesContainer"
                class="clues-container"
            ></div>

            <!-- Fixed to the bottom of the clues column -->
            <div class="hunt-row">
                Hunt the Killer
            </div>

            <div class="remaining-row">
                Remaining Suspects:
                <span id="remainingSuspects">0</span>
            </div>

        </section>


        <!-- RIGHT COLUMN -->
        <section class="suspects-section">

            <div class="section-title">
                Suspects
            </div>

            <!-- Suspects get added here later -->
            <div
                id="suspectsContainer"
                class="suspects-container"
            ></div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
