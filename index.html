<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hunt the Killer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-board">

        <header class="page-header">
            Hunt the Killer
        </header>

        <section class="clues-section">

            <div class="section-title">
                Clues
            </div>

            <div
                id="cluesContainer"
                class="clues-container"
            ></div>

            <div class="guess-section">
    <label for="guessInput" class="guess-label">
        Enter Your Guess
    </label>

    <div class="guess-controls">
        <input
            id="guessInput"
            class="guess-input"
            type="text"
            placeholder="Suspect name"
            autocomplete="off"
        >

        <button
            id="guessButton"
            class="guess-button"
            type="button"
        >
            Guess
        </button>
    </div>

    <div
        id="guessResult"
        class="guess-result"
        aria-live="polite"
    ></div>
</div>

<div class="remaining-row">
    Remaining Suspects:
    <span id="remainingSuspects">0</span>
</div>

        </section>

        <section class="suspects-section">

            <div class="section-title">
                Suspects
            </div>

            <div
                id="suspectsContainer"
                class="suspects-container"
            ></div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
