<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Killer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-board">

        <!-- LEFT SIDE -->
        <section class="clues-section">
            <div class="section-header">
                <h1>Clues</h1>
            </div>

            <!-- Clues will be added here later -->
            <div id="cluesContainer" class="clues-container"></div>
        </section>

        <!-- RIGHT SIDE -->
        <section class="suspects-section">
            <div class="section-header suspects-header">
                <h1>Suspects</h1>

                <p class="remaining-counter">
                    Remaining Suspects:
                    <span id="remainingSuspects">0</span>
                </p>
            </div>

            <!-- Suspects will be added here later -->
            <div id="suspectsContainer" class="suspects-container"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
